<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Detalhe macro do acabamento de uma unha esmaltada">
  <title>Detalhe — acabamento</title>
  <desc>
    ARTE TEMPORÁRIA DE DEMONSTRAÇÃO.
    Macro do acabamento de uma unha: cutícula limpa, esmalte uniforme e borda
    definida. Não representa pessoa real. Substituível pelo CMS.
  </desc>

  <defs>
    <radialGradient id="d-amb" cx="35%" cy="30%" r="90%">
      <stop offset="0%"   stop-color="#3B075A"/>
      <stop offset="55%"  stop-color="#1E0630"/>
      <stop offset="100%" stop-color="#0B0610"/>
    </radialGradient>

    <linearGradient id="d-esmalte" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#EE5BFF"/>
      <stop offset="40%"  stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>

    <linearGradient id="d-pele" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#EBD8E6"/>
      <stop offset="70%"  stop-color="#C9A9C2"/>
      <stop offset="100%" stop-color="#9C7A9A"/>
    </linearGradient>

    <linearGradient id="d-brilho" x1="0%" y1="0%" x2="100%" y2="70%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%"  stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="d-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>

    <filter id="d-sombra" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0B0610" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#d-amb)"/>

  <g filter="url(#d-blur)" opacity="0.5">
    <circle cx="950" cy="180" r="180" fill="#D946EF" opacity="0.35"/>
    <circle cx="180" cy="720" r="200" fill="#7E22CE" opacity="0.4"/>
  </g>

  <!-- Dedo em close, entrando pela esquerda. -->
  <g transform="translate(600 470) rotate(-18)">
    <path d="M-460,-150 C-300,-186 -110,-192 40,-172 C132,-160 196,-122 210,-58
             C224,10 190,74 104,110 C-40,170 -290,176 -460,146 Z"
          fill="url(#d-pele)" filter="url(#d-sombra)"/>

    <!-- Cutícula: a linha limpa que define o trabalho bem feito. -->
    <path d="M18,-166 C74,-150 108,-108 112,-52 C116,4 92,52 34,92"
          stroke="#8E6A8C" stroke-width="5" fill="none" opacity="0.55"/>

    <!-- A unha. -->
    <g transform="translate(96 -28)">
      <path d="M0,-136 C46,-136 78,-96 82,-40 C86,20 70,86 44,124
               C30,144 14,154 0,154 C-14,154 -30,144 -44,124
               C-70,86 -86,20 -82,-40 C-78,-96 -46,-136 0,-136 Z"
            fill="url(#d-esmalte)"/>
      <path d="M0,-136 C46,-136 78,-96 82,-40 C86,20 70,86 44,124
               C30,144 14,154 0,154 C-14,154 -30,144 -44,124
               C-70,86 -86,20 -82,-40 C-78,-96 -46,-136 0,-136 Z"
            fill="url(#d-brilho)" transform="scale(0.78) translate(-14 -20)"/>

      <!-- Reflexo comprido: o verniz. -->
      <path d="M-34,-96 C-52,-40 -54,30 -40,96" stroke="#FFFFFF" stroke-opacity="0.5"
            stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M34,-84 C48,-34 48,26 36,80" stroke="#FFFFFF" stroke-opacity="0.22"
            stroke-width="5" fill="none" stroke-linecap="round"/>

      <!-- Borda livre, bem definida. -->
      <path d="M-44,124 C-30,144 -14,154 0,154 C14,154 30,144 44,124"
            stroke="#FCF9FF" stroke-opacity="0.75" stroke-width="4" fill="none"/>
    </g>
  </g>

  <g fill="#EE5BFF">
    <circle cx="1040" cy="640" r="3" opacity="0.7"/>
    <circle cx="150" cy="220" r="2.5" opacity="0.6"/>
    <circle cx="880" cy="800" r="2" opacity="0.5"/>
  </g>
</svg>
